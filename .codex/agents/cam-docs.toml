## Fuentes de verdad
- Sistema de tokens y dirección visual: `AGENTS.md` y `src/styles.scss`.
- Mapa de rutas y navegación: el enrutador de la aplicación.
- Estado del proyecto: `plan-implementacion.md`, `tareas.md` y `fixes.md` en la raíz."""
