<a class="skip-link" href="#contenido-principal" (click)="irAlContenido($event)">Saltar al contenido</a>

<app-header (panelCambia)="contentInert.set($event)"></app-header>

<div class="envoltorio">
<main
  id="contenido-principal"
  class="content"
  tabindex="-1"
  [attr.inert]="contentInert() ? '' : null"
>
  <router-outlet></router-outlet>
</main>
</div>

@if (esPortada()) {
  <app-whatsapp-widget [attr.inert]="contentInert() ? '' : null"></app-whatsapp-widget>
}

<app-footer [attr.inert]="contentInert() ? '' : null"></app-footer>
