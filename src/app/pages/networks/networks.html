<div class="networks-widget">

  <h2 class="widget-title">REDES SOCIALES</h2>

  <div class="widget-card">
    <ul class="social-list">
      <li>
        <a href="https://facebook.com" target="_blank" class="social-link facebook">
          <fa-icon [icon]="iconFacebook"></fa-icon>
          <span class="network-name">Facebook</span>
        </a>
      </li>

      <li>
        <a href="https://youtube.com" target="_blank" class="social-link youtube">
          <fa-icon [icon]="iconYoutube"></fa-icon>
          <span class="network-name">Youtube</span>
        </a>
      </li>
      <li>
        <a href="https://tiktok.com" target="_blank" class="social-link tiktok">
          <fa-icon [icon]="iconTiktok"></fa-icon>
          <span class="network-name">Tiktok</span>
        </a>
      </li>

      <li>
        <a href="https://spotify.com" target="_blank" class="social-link spotify">
          <fa-icon [icon]="iconSpotify"></fa-icon>
          <span class="network-name">Spotify</span>
        </a>
      </li>
      <li>
        <a href="https://instagram.com" target="_blank" class="social-link instagram">
          <fa-icon [icon]="iconInstagram"></fa-icon>
          <span class="network-name">Instagram</span>
        </a>
      </li>
    </ul>
  </div>

</div>
