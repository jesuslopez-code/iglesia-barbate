<app-franja titulo="Contacto">
  <p>Escríbenos o encuéntranos por estos medios.</p>
</app-franja>

<section class="page-section contacto-datos" aria-labelledby="datos-de-contacto">
  <h2 id="datos-de-contacto">Datos de contacto</h2>
  <p>Teléfono: <a [href]="telefonoHref">{{ telefonoTexto }}</a></p>
  <p>Correo: <a [href]="correoHref">{{ correoTexto }}</a></p>
  <app-networks class="d-block"></app-networks>
</section>

<section class="page-section" aria-labelledby="formulario-contacto">
  <h2 id="formulario-contacto">Envíanos un mensaje</h2>
  <app-form-contact></app-form-contact>
</section>
