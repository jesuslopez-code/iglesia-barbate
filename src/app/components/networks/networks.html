<div class="networks-widget w-100">
  <p class="networks-rotulo">Redes sociales</p>

  <ul class="networks-lista">
    @for (red of redes; track red.href) {
      <li>
        <a [href]="red.href" target="_blank" rel="noopener" class="social-link" [class]="red.clase">
          <fa-icon [icon]="red.icono" class="social-icono"></fa-icon>
          <span class="social-texto">
            <span class="social-nombre">{{ red.nombre }}</span>
            <span class="social-detalle">{{ red.detalle }}</span>
          </span>
          <fa-icon [icon]="iconoFlecha" class="social-flecha" aria-hidden="true"></fa-icon>
        </a>
      </li>
    }
  </ul>
</div>
