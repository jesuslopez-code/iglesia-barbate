<form class="mb-4">
  <div class="card p-4 shadow-sm" style="max-width: 800px; width: 100%;">
    <h3 class="card-title mb-3 text-center fw-bold">Contáctanos</h3>
    <div class="mb-3">
      <label for="name" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="name" placeholder="Tu nombre" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Correo Electrónico</label>
      <input type="email" class="form-control" id="email" placeholder="" required>
    </div>
    <div>
      <label for="message" class="form-label">Mensaje</label>
        <div class="mb-3">
        <textarea class="form-control" id="message" rows="3" placeholder="Escribe tu mensaje aquí..." required></textarea>
    </div>
    <div>
      <button type="submit" class="btn btn-custom-pink w-100">Enviar</button>
    </div>
    </div>
  </div>
</form>
