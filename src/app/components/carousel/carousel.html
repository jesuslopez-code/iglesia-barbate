<!-- Sin data-bs-ride: la rotación automática de Bootstrap no se puede parar en pantalla táctil
     (solo pausa con el ratón encima). Se navega con las flechas, igual que el carrusel de vídeos. -->
<div id="carruselIglesia" class="carousel slide">
  <div class="carousel-inner">
    @for (slide of slides; track slide.src; let esPrimera = $first) {
      <div class="carousel-item" [class.active]="esPrimera">
        <picture>
          <source type="image/webp" [srcset]="slide.srcsetWebp" [attr.sizes]="slide.srcset ? sizes : null" />
          <img
            class="carousel-imagen"
            [src]="slide.src"
            [attr.srcset]="slide.srcset"
            [attr.sizes]="slide.srcset ? sizes : null"
            [alt]="slide.alt"
            [width]="slide.width"
            [height]="slide.height"
            [attr.loading]="esPrimera && prioritaria ? null : 'lazy'"
            [attr.fetchpriority]="esPrimera && prioritaria ? 'high' : null"
          />
        </picture>
      </div>
    }
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carruselIglesia" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselIglesia" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
