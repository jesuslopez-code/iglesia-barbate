<div id="carruselIglesia" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    @for (slide of slides; track slide.src; let esPrimera = $first) {
      <div class="carousel-item" [class.active]="esPrimera">
        <img
          class="carousel-imagen"
          [src]="slide.src"
          [attr.srcset]="slide.srcset"
          [attr.sizes]="slide.srcset ? sizes : null"
          [alt]="slide.alt"
          [width]="slide.width"
          [height]="slide.height"
          [attr.loading]="esPrimera ? null : 'lazy'"
          [attr.fetchpriority]="esPrimera ? 'high' : null"
        />
      </div>
    }
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carruselIglesia" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carruselIglesia" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
