<div class="whatsapp-widget-container">

  <div class="chat-box" *ngIf="isChatOpen">

    <div class="chat-header">
      <div class="header-info">
        <img src="/whatsapp.svg" alt="" width="24" height="24">
        <span>WhatsApp</span>
      </div>
      <button class="close-btn" (click)="toggleChat()" aria-label="Cerrar el chat">×</button>
    </div>

    <div class="chat-body">
      <div class="message-bubble">
        <span class="bubble-name">Iglesia El Camino</span>
        <p>Hola 👋<br>¿En qué podemos ayudarte?</p>
        <span class="bubble-time">Justo ahora</span>
      </div>
    </div>

    <div class="chat-footer">
      <button class="open-chat-btn" (click)="openWhatsApp()">
        Abrir chat <span class="send-icon">➤</span>
      </button>
    </div>
  </div>

  <button class="fab-button" (click)="toggleChat()" aria-label="Abrir el chat de WhatsApp">
    <img src="/whatsapp.svg" alt="" width="35" height="35">
  </button>

</div>
