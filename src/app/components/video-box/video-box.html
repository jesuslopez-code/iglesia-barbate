<div class="card h-100 shadow-sm border-0 video-card">

  <div class="ratio ratio-16x9">
    <iframe
      [src]="safeUrl"
      title="YouTube video"
      allowfullscreen>
    </iframe>
  </div>

  <div class="card-body p-3 text-center">
    <h6 class="fw-bold mb-0 text-dark">{{ title }}</h6>
  </div>

</div>
